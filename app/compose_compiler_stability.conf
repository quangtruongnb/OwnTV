// Compose Compiler Stability Configuration
// Declares external classes (from :core library) as stable so the Compose compiler
// can skip composables that receive them as parameters when their value hasn't changed.
//
// A class is safe to declare stable here when ALL of the following hold:
//   1. It is a Kotlin data class (structural equality via equals/hashCode).
//   2. All its properties are val (immutable after construction).
//   3. All property types are themselves stable (primitives, String, enums, other stable data classes).
//
// See: https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file

// --- kotlin.collections ---
// Kotlin's List<T> is a read-only interface. All instances passed through StateFlow
// collectors are immutable snapshots — safe to treat as stable for skip purposes.
kotlin.collections.List

// --- tv.own.owntv.core.theme ---
// FontCustomization: data class(mainFamily, popupFamily, sizePercent, popupFontSizePercent,
//   popupSizePercent) — all val, all stable types (AppFontFamily enum + Int).
tv.own.owntv.core.theme.FontCustomization

// --- tv.own.owntv.core.weather ---
// WeatherInfo: data class(city, tempC, iconCode, description) — all val, all String/Int.
// Refreshes every ~30 min; stable across the interval so skip is safe.
tv.own.owntv.core.weather.WeatherInfo

// --- tv.own.owntv.core.launcher ---
// LauncherDeepLink: sealed class hierarchy used as one-shot navigation events.
// Subclasses are data classes with stable (String/Long) payloads.
tv.own.owntv.core.launcher.LauncherDeepLink

// --- tv.own.owntv.core.database.entity ---
// SourceEntity: Room @Entity data class (all val, primitive + String fields).
// List<SourceEntity> passed to OwnTVShell for the playlist switcher; the list
// reference only changes when Room emits a new snapshot (structural change),
// making it safe to treat as stable for skip purposes.
tv.own.owntv.core.database.entity.SourceEntity
